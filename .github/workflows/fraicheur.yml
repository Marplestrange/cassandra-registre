name: Renouveler la fraîcheur de l'index
# Chaque jour, une clé à FAIBLE pouvoir signe « l'index publié est toujours le courant » (outils/fraicheur.py).
# La clé racine, elle, n'est jamais ici. Si ce secret fuit, on peut seulement prolonger la fraîcheur d'un index que la racine a déjà signé.
# Prérequis : le secret FRAICHEUR_CLE_PRIVEE (le PEM de la clé de fraîcheur) et un index qui annonce cette clé (registre.py publier).
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  fraicheur:
    runs-on: ubuntu-24.04
    if: ${{ vars.FRAICHEUR_ACTIVE == 'oui' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Signer la fraîcheur
        env:
          CLE: ${{ secrets.FRAICHEUR_CLE_PRIVEE }}
        run: |
          umask 077
          printf '%s\n' "$CLE" > "$RUNNER_TEMP/fraicheur.pem"
          python outils/fraicheur.py signer --cle "$RUNNER_TEMP/fraicheur.pem"
          rm -f "$RUNNER_TEMP/fraicheur.pem"
      - name: Publier
        run: |
          git config user.name "registre-fraicheur"
          git config user.email "registre@users.noreply.github.com"
          git add docs/fraicheur.json docs/fraicheur.json.sig
          git diff --cached --quiet || git commit -m "Fraîcheur de l'index renouvelée"
          git push
      - name: Prévenir si la fraîcheur n'a pas pu être renouvelée
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Sans fraîcheur renouvelée, l'index expire et les installations de Cassandra le refusent : un ticket l'annonce (un seul à la fois).
          if [ -z "$(gh issue list --state open --label fraicheur --json number --jq '.[0].number')" ]; then
            gh label create fraicheur --color B60205 --description "La fraîcheur de l'index n'a pas pu être renouvelée" 2>/dev/null || true
            gh issue create --label fraicheur --title "La fraîcheur de l'index n'a pas été renouvelée"               --body "Le renouvellement quotidien a échoué : $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Voir GOUVERNANCE.md (panne de la clé de fraîcheur, secret FRAICHEUR_CLE_PRIVEE)."
          fi
