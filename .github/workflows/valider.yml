name: Valider le registre
on:
  pull_request:
  push:
    branches: [main]
# Cette validation ne fait que LIRE : aucun droit d'écriture, même si le réglage par défaut du dépôt change.
permissions:
  contents: read

jobs:
  valider:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Contrôler les archives, l'analyse du code, les éditeurs, les révocations, les avis, le journal et l'index publié
        run: python outils/registre.py verifier
      - name: La provenance — chaque archive qui déclare sa source doit en être la copie exacte
        run: python outils/registre.py provenance
      - name: Tester l'outil
        run: python -m unittest discover -s tests -v
